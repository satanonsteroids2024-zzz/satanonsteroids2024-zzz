<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="55%" stop-color="#1A0000"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD200"/>
      <stop offset="100%" stop-color="#FF1E1E"/>
    </linearGradient>
    <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <rect width="10" height="10" fill="#FFFFFF"/>
      <rect x="10" y="10" width="10" height="10" fill="#FFFFFF"/>
      <rect x="10" width="10" height="10" fill="#0A0A0A"/>
      <rect y="10" width="10" height="10" fill="#0A0A0A"/>
    </pattern>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>

  <!-- checkered corners -->
  <g opacity="0.85">
    <rect x="-20" y="-20" width="110" height="110" fill="url(#checker)"/>
    <rect x="810" y="170" width="110" height="110" fill="url(#checker)"/>
  </g>

  <!-- perspective track lines -->
  <g stroke="#FF1E1E" stroke-opacity="0.35" stroke-width="2">
    <line x1="450" y1="260" x2="60" y2="150"/>
    <line x1="450" y1="260" x2="250" y2="130"/>
    <line x1="450" y1="260" x2="450" y2="110"/>
    <line x1="450" y1="260" x2="650" y2="130"/>
    <line x1="450" y1="260" x2="840" y2="150"/>
  </g>

  <!-- speed lines -->
  <g stroke="#FFD200" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
    <line x1="0" y1="40" x2="70" y2="40"/>
    <line x1="0" y1="60" x2="110" y2="60"/>
    <line x1="0" y1="80" x2="50" y2="80"/>
    <line x1="760" y1="200" x2="900" y2="200"/>
    <line x1="790" y1="220" x2="900" y2="220"/>
    <line x1="810" y1="240" x2="900" y2="240"/>
  </g>

  <!-- helmet silhouette (right side) -->
  <g transform="translate(700,60)" opacity="0.9">
    <path d="M60 110 C60 60 100 25 150 25 C205 25 245 65 245 115 C245 140 230 150 200 150 L80 150 C55 150 60 130 60 110 Z" fill="#111111" stroke="#FFD200" stroke-width="2"/>
    <path d="M80 95 C80 70 110 55 150 55 C190 55 215 75 220 100 L220 110 L80 110 Z" fill="#FF1E1E"/>
    <rect x="75" y="100" width="150" height="22" rx="10" fill="#0A0A0A" stroke="#FFD200" stroke-width="2"/>
    <circle cx="150" cy="30" r="6" fill="#FFD200"/>
  </g>

  <!-- title -->
  <text x="60" y="110" font-family="Arial Black, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#glow)" letter-spacing="2">BHARATH SURYA</text>
  <text x="62" y="145" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#FFFFFF" opacity="0.85">AI Systems Architect</text>

  <!-- tagline bar -->
  <rect x="60" y="175" width="560" height="30" rx="6" fill="#FF1E1E"/>
  <text x="75" y="196" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#0A0A0A" letter-spacing="1">AI-ASSISTED DEVELOPMENT · AUTOMATION · LLM WORKFLOWS</text>
</svg>
