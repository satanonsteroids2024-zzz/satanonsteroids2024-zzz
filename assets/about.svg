<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
<style>
.f{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes rise{from{transform:translateY(12px)}to{transform:none}}
.r{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}
.spin-slow{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .r{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}} .bob{animation:bob .35s ease-in-out infinite}</style>
<defs><clipPath id="clip"><rect width="1200" height="420" rx="16"/></clipPath><pattern id="kerbA" width="32" height="3" patternUnits="userSpaceOnUse"><rect width="16" height="3" fill="#E10600"/><rect x="16" width="16" height="3" fill="#F2F2F2"/></pattern><clipPath id="pclip"><rect x="760" y="84" width="400" height="296" rx="12"/></clipPath></defs>
<g clip-path="url(#clip)">
<rect width="1200" height="420" fill="#121B2D"/>
<rect x="40" y="45" width="10" height="10" rx="2" fill="#E10600"/><text x="60" y="56" class="m" font-size="14" letter-spacing="3" fill="#8A97B4">DRIVER PROFILE</text><text x="1160" y="56" text-anchor="end" class="m" font-size="14" letter-spacing="2" fill="#F5B14C">CAR No. 01</text>
<g class="r" style="animation-delay:0.15s"><text x="40" y="104" class="m" font-size="13" letter-spacing="2" fill="#5B6884">TEAM</text><text x="230" y="104" class="f" font-size="18" font-weight="500" fill="#E8EDF7">CS @ Newton School of Technology</text><line x1="40" y1="124" x2="720" y2="124" stroke="#243251"/></g>
<g class="r" style="animation-delay:0.24s"><text x="40" y="154" class="m" font-size="13" letter-spacing="2" fill="#5B6884">ROLE</text><text x="230" y="154" class="f" font-size="18" font-weight="500" fill="#E8EDF7">AI Systems Architect &amp; Builder</text><line x1="40" y1="174" x2="720" y2="174" stroke="#243251"/></g>
<g class="r" style="animation-delay:0.33s"><text x="40" y="204" class="m" font-size="13" letter-spacing="2" fill="#5B6884">BASE</text><text x="230" y="204" class="f" font-size="18" font-weight="500" fill="#E8EDF7">Bengaluru, India</text><line x1="40" y1="224" x2="720" y2="224" stroke="#243251"/></g>
<g class="r" style="animation-delay:0.42s"><text x="40" y="254" class="m" font-size="13" letter-spacing="2" fill="#5B6884">POWER UNIT</text><text x="230" y="254" class="f" font-size="18" font-weight="500" fill="#E8EDF7">Python · FastAPI · LLM APIs · n8n · Zapier</text><line x1="40" y1="274" x2="720" y2="274" stroke="#243251"/></g>
<g class="r" style="animation-delay:0.51s"><text x="40" y="304" class="m" font-size="13" letter-spacing="2" fill="#5B6884">RACECRAFT</text><text x="230" y="304" class="f" font-size="18" font-weight="500" fill="#E8EDF7">Multi-agent routing · Prompting · Automation</text><line x1="40" y1="324" x2="720" y2="324" stroke="#243251"/></g>
<g class="r" style="animation-delay:0.60s"><text x="40" y="354" class="m" font-size="13" letter-spacing="2" fill="#5B6884">STATUS</text><circle cx="236" cy="348" r="5" fill="#4CC38A" class="pulse"/><text x="250" y="354" class="f" font-size="18" font-weight="500" fill="#4CC38A">Open to freelance, automation &amp; writing work</text><line x1="40" y1="374" x2="720" y2="374" stroke="#243251"/></g>
<rect x="760" y="84" width="400" height="296" rx="12" fill="#16213A" stroke="#243251"/>
<text x="780" y="116" class="m" font-size="12" letter-spacing="2" fill="#5B6884">ON TRACK</text>
<text x="1140" y="116" text-anchor="end" class="m pulse" font-size="12" letter-spacing="2" fill="#FF3B30">● P1</text>
<rect x="760" y="254" width="400" height="3" fill="url(#kerbA)"/>
<g clip-path="url(#pclip)"><line x1="1160" y1="196" x2="1220" y2="196" stroke="#8A97B4" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"><animate attributeName="x1" values="1160;640" dur="0.8s" begin="0.00s" repeatCount="indefinite"/><animate attributeName="x2" values="1220;700" dur="0.8s" begin="0.00s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;.6;0" dur="0.8s" begin="0.00s" repeatCount="indefinite"/></line><line x1="1160" y1="216" x2="1257" y2="216" stroke="#8A97B4" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"><animate attributeName="x1" values="1160;640" dur="0.8s" begin="0.17s" repeatCount="indefinite"/><animate attributeName="x2" values="1257;737" dur="0.8s" begin="0.17s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;.6;0" dur="0.8s" begin="0.17s" repeatCount="indefinite"/></line><line x1="1160" y1="234" x2="1294" y2="234" stroke="#8A97B4" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"><animate attributeName="x1" values="1160;640" dur="0.8s" begin="0.34s" repeatCount="indefinite"/><animate attributeName="x2" values="1294;774" dur="0.8s" begin="0.34s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;.6;0" dur="0.8s" begin="0.34s" repeatCount="indefinite"/></line><line x1="1160" y1="244" x2="1241" y2="244" stroke="#8A97B4" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"><animate attributeName="x1" values="1160;640" dur="0.8s" begin="0.51s" repeatCount="indefinite"/><animate attributeName="x2" values="1241;721" dur="0.8s" begin="0.51s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;.6;0" dur="0.8s" begin="0.51s" repeatCount="indefinite"/></line></g>
<g class="bob"><g class="" transform="translate(794 154) scale(0.92)"><ellipse cx="185" cy="104" rx="175" ry="5" fill="#000" opacity=".45"/><rect x="6" y="16" width="9" height="56" rx="2" fill="#0A0A0A"/><rect x="2" y="16" width="50" height="10" rx="2" fill="#E10600"/><rect x="10" y="42" width="32" height="5" fill="#0A0A0A"/><rect x="30" y="86" width="300" height="6" rx="2" fill="#0A0A0A"/><path d="M40 86 L44 60 L95 54 L128 32 L150 28 L168 32 L176 50 L214 52 L250 60 L300 70 L338 78 L348 86 Z" fill="#E10600"/><path d="M100 86 L104 64 L170 60 L230 64 L252 86 Z" fill="#A80400"/><path d="M150 57 L302 74 L302 79 L150 63 Z" fill="#F2F2F2" opacity=".92"/><path d="M128 32 L150 28 L168 32 L160 40 L134 40 Z" fill="#0A0A0A"/><text x="118" y="80" class="m" font-size="13" font-weight="700" fill="#F2F2F2">01</text><circle cx="196" cy="45" r="9" fill="#F5B14C"/><rect x="196" y="41" width="10" height="5" rx="2" fill="#0A0A0A"/><path d="M180 51 Q196 32 216 51" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round"/><rect x="318" y="88" width="42" height="6" rx="2" fill="#0A0A0A"/><rect x="354" y="78" width="6" height="16" rx="1" fill="#E10600"/><circle cx="78" cy="82" r="22" fill="#07090D"/><circle cx="78" cy="82" r="16" stroke="#FF3B30" stroke-width="2.5"/><circle cx="78" cy="82" r="8" fill="#2A3550"/><g class="spin"><path d="M67 82H89M78 71V93" stroke="#7F8BA6" stroke-width="2.4"/></g><circle cx="282" cy="85" r="19" fill="#07090D"/><circle cx="282" cy="85" r="13" stroke="#FF3B30" stroke-width="2.5"/><circle cx="282" cy="85" r="8" fill="#2A3550"/><g class="spin"><path d="M271 85H293M282 74V96" stroke="#7F8BA6" stroke-width="2.4"/></g></g></g>
<text x="780" y="302" class="f" font-size="16" font-style="italic" fill="#8A97B4">“I design the system, set the strategy,</text>
<text x="780" y="328" class="f" font-size="16" font-style="italic" fill="#8A97B4">and let AI handle the pit work.”</text>
</g>
