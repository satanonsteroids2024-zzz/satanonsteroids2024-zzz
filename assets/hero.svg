<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" fill="none">
<style>
.f{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes rise{from{transform:translateY(12px)}to{transform:none}}
.r{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}
.spin-slow{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .r{opacity:1}}
@keyframes L0{0%,6.05%{fill:#1A2236}6.25%,57.20%{fill:#FF2A1F}57.50%,100%{fill:#1A2236}}.l0{fill:#1A2236;animation:L0 8.0s linear infinite}@keyframes L1{0%,14.80%{fill:#1A2236}15.00%,57.20%{fill:#FF2A1F}57.50%,100%{fill:#1A2236}}.l1{fill:#1A2236;animation:L1 8.0s linear infinite}@keyframes L2{0%,23.55%{fill:#1A2236}23.75%,57.20%{fill:#FF2A1F}57.50%,100%{fill:#1A2236}}.l2{fill:#1A2236;animation:L2 8.0s linear infinite}@keyframes L3{0%,32.30%{fill:#1A2236}32.50%,57.20%{fill:#FF2A1F}57.50%,100%{fill:#1A2236}}.l3{fill:#1A2236;animation:L3 8.0s linear infinite}@keyframes L4{0%,41.05%{fill:#1A2236}41.25%,57.20%{fill:#FF2A1F}57.50%,100%{fill:#1A2236}}.l4{fill:#1A2236;animation:L4 8.0s linear infinite}@keyframes go{0%,57.5%{opacity:0}58.5%,92%{opacity:1}96%,100%{opacity:0}}.go{opacity:0;animation:go 8.0s linear infinite}@keyframes drive{0%,57.5%{transform:translateX(0)}86%{transform:translateX(1300px)}86.01%{transform:translateX(-420px)}100%{transform:translateX(0)}}.drive{animation:drive 8.0s cubic-bezier(.55,0,.75,.6) infinite}@keyframes sweep{from{transform:translateX(-400px)}to{transform:translateX(1400px)}}.sweep{animation:sweep 5s linear infinite}</style>
