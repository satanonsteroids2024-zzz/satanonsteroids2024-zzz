<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
<style>
.f{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes rise{from{transform:translateY(12px)}to{transform:none}}
.r{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}
.spin-slow{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .r{opacity:1}}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}.eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite}@keyframes candle{0%{transform:scaleY(.2);opacity:0}30%,100%{transform:scaleY(1);opacity:1}}.cd{transform-box:fill-box;transform-origin:bottom;animation:candle 3s ease-out infinite}</style>
