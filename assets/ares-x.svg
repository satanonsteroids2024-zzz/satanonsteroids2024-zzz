<g class="r" style="animation-delay:0.60s"><rect x="1000" y="254" width="140" height="66" rx="10" fill="#4CC38A" fill-opacity=".08" stroke="#4CC38A" stroke-opacity=".55" class=""/><rect x="1000" y="268" width="3" height="38" rx="1.5" fill="#4CC38A"/><text x="1016" y="282" class="f" font-size="16" font-weight="700" fill="#E8EDF7">Recommend</text><text x="1016" y="304" class="m" font-size="12" fill="#8A97B4">never auto-acts</text></g>
<text x="60" y="342" class="m" font-size="12" fill="#5B6884">Falls back down the chain on rate limits or outages · runs fully local via Ollama when needed</text>
