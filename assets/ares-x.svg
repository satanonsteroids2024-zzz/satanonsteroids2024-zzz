<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" fill="none">
<style>
.f{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.r{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}
.spin-slow{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .r{opacity:1}}
@keyframes fill{from{width:0}to{width:var(--w)}}.bar{animation:fill 1.6s cubic-bezier(.2,.7,.2,1) .6s both}@keyframes glow{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}.glow{animation:glow 2.4s ease-in-out infinite}</style>
<defs><clipPath id="clip"><rect width="1200" height="640" rx="16"/></clipPath></defs>
<g clip-path="url(#clip)">
<rect width="1200" height="640" fill="#121B2D"/>
<rect x="40" y="45" width="10" height="10" rx="2" fill="#E10600"/><text x="60" y="56" class="m" font-size="14" letter-spacing="3" fill="#8A97B4">POLE POSITION  ·  FLAGSHIP BUILD</text>
<rect x="909" y="36" width="251" height="30" rx="15" fill="#F5B14C" fill-opacity=".12" stroke="#F5B14C" stroke-opacity=".5"/>
