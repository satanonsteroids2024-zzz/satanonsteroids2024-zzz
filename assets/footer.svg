<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="t d">
<title id="t">Footer</title>
<desc id="d">A slow ASCII wave drifting under a closing line.</desc>
<style>
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace} .sans{font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif} .serif{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif}
@keyframes pulse{0%,100%{transform:scale(1,1)}45%{transform:scale(.93,1.06)}}
@keyframes fa{0%,33.3%{opacity:1}33.4%,100%{opacity:0}}
@keyframes fb{0%,33.3%{opacity:0}33.4%,66.6%{opacity:1}66.7%,100%{opacity:0}}
@keyframes fc{0%,66.6%{opacity:0}66.7%,100%{opacity:1}}
@keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-24px)}}
@keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,-16px)}}
@keyframes twinkle{0%,100%{opacity:.08}50%{opacity:.75}}
.bell{transform-box:fill-box;transform-origin:50% 0;animation:pulse 3.6s ease-in-out infinite}
.fa{animation:fa 1.8s steps(1) infinite} .fb{animation:fb 1.8s steps(1) infinite} .fc{animation:fc 1.8s steps(1) infinite}
.dA{animation:driftA 9s ease-in-out infinite} .dB{animation:driftB 11s ease-in-out infinite}
.tw{animation:twinkle 4s ease-in-out infinite}
@keyframes w0{from{transform:translateX(0)}to{transform:translateX(-67.2px)}}@keyframes w1{from{transform:translateX(0)}to{transform:translateX(-67.2px)}}@keyframes w2{from{transform:translateX(0)}to{transform:translateX(-67.2px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><pattern id="grid" width="10" height="15" patternUnits="userSpaceOnUse"><path d="M10 0V15M0 15H10" stroke="#fff" stroke-opacity=".035" fill="none"/></pattern><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".12" stop-color="#fff"/><stop offset=".88" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="m"><rect width="1200" height="130" fill="url(#fade)"/></mask><linearGradient id="gc" x1="0" x2="1"><stop offset="0" stop-color="#7ce8f2"/><stop offset="1" stop-color="#b9a6ff"/></linearGradient><clipPath id="clip"><rect width="1200" height="130" rx="18"/></clipPath></defs>
<g clip-path="url(#clip)"><rect width="1200" height="130" fill="#04060a"/><rect width="1200" height="130" fill="url(#grid)"/>
<g mask="url(#m)" class="mono" font-size="14">
<g class="" style="animation:w0 22s linear infinite"><text x="-10" y="30" textLength="1411.2" lengthAdjust="spacing" xml:space="preserve" fill="url(#gc)" fill-opacity="0.75">~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'</text></g>
<g class="" style="animation:w1 31s linear infinite"><text x="-40" y="50" textLength="1411.2" lengthAdjust="spacing" xml:space="preserve" fill="url(#gc)" fill-opacity="0.45">~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'</text></g>
<g class="" style="animation:w2 44s linear infinite"><text x="-20" y="70" textLength="1411.2" lengthAdjust="spacing" xml:space="preserve" fill="url(#gc)" fill-opacity="0.25">~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'~-._.-~'</text></g>
</g>
<text x="600.0" y="108" text-anchor="middle" class="mono" font-size="12" letter-spacing="4" fill="#808a9a" xml:space="preserve">DRIFT GENTLY       SHIP CAREFULLY</text>
<rect x="598.0" y="99" width="8" height="8" rx="2" fill="#d4af37"/>
</g></svg>
